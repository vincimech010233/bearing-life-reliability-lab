name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: OPENBLAS_NUM_THREADS=2 MPLBACKEND=Agg python -m unittest discover -s tests -v
      - run: OPENBLAS_NUM_THREADS=2 MPLBACKEND=Agg python src/bearing.py examples/bearing.json results
      - run: ruff check src tests --select E4,E7,E9,F && ruff format --check src tests
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests tools --select E4,E7,E9,F && ruff format --check src tests tools
